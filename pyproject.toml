[project]
name = "vision-blindspots"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.0.0",
    "datasets>=4.8.4",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.0.0",
    "numpy>=2.4.3",
    "pillow>=12.1.1",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=5.3.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pyright>=1.1.408",
    "ruff>=0.15.7",
    "ty>=0.0.25",
]
